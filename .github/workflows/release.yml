name: 'release'

on:
  push:
    tags: [ '*' ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Linter 🧹
        id: linter
        run: make lint

  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      matrix:
        php-version: ["8.3", "8.4"]
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer

      - name: Install dependencies 📦
        run: composer install --prefer-dist --no-progress

      - name: Install WordPress test suite 🔧
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run PHPUnit 🧪
        run: vendor/bin/phpunit --colors=always
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: wordpress_test

  package:
    runs-on: ubuntu-24.04
    needs: [ lint, test ]
    permissions:
      contents: write
    env:
      # Read by bmlt-wordpress-deploy/deploy-wordpress.sh.
      PLUGIN: polenta
      MAINFILE: polenta.php
      DIST_DIR_GITHUB: dist/github
      GITHUB_RELEASE_FILENAME: polenta.zip
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Build plugin zip 📦
        run: |
          export ZIP_FILENAME=polenta-${GITHUB_REF_NAME}.zip
          make build
          echo "ARTIFACT_PATH=build/${ZIP_FILENAME}" >> "$GITHUB_ENV"

      - name: Generate Release Notes 📝
        if: github.ref_type == 'tag'
        run: |
          curl -fsSL -o gh-release-notes.sh https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/main/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh readme.txt "wp"
          if [[ "$GITHUB_REF_NAME" == *beta* ]]; then
            echo "RELEASE_TYPE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TYPE=false" >> "$GITHUB_ENV"
          fi

      - name: Create Release 🎉
        uses: ncipollo/release-action@v1
        if: github.ref_type == 'tag'
        with:
          artifacts: ${{ env.ARTIFACT_PATH }}
          bodyFile: changelog.txt
          prerelease: ${{ env.RELEASE_TYPE }}

      # deploy-wordpress.sh expects the plugin files at the top level of the zip.
      # The GitHub release zip keeps its polenta/ folder so it installs cleanly
      # through WP Admin, so unwrap a copy of it for SVN.
      - name: Repack zip for WordPress.org 🗜️
        if: github.ref_type == 'tag' && !contains(github.ref, 'beta')
        run: |
          REPACK_DIR="$RUNNER_TEMP/wp-repack"
          rm -rf "$REPACK_DIR" "$DIST_DIR_GITHUB"
          mkdir -p "$REPACK_DIR" "$DIST_DIR_GITHUB"
          unzip -q "$ARTIFACT_PATH" -d "$REPACK_DIR"
          test -f "$REPACK_DIR/$PLUGIN/$MAINFILE"
          test -f "$REPACK_DIR/$PLUGIN/readme.txt"
          (cd "$REPACK_DIR/$PLUGIN" && zip -qr "$GITHUB_WORKSPACE/$DIST_DIR_GITHUB/$GITHUB_RELEASE_FILENAME" .)
          unzip -l "$DIST_DIR_GITHUB/$GITHUB_RELEASE_FILENAME"

      - name: Wordpress Release ⛴
        if: github.ref_type == 'tag' && !contains(github.ref, 'beta')
        id: wordpress-stable-release
        env:
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
        run: |
          curl -fsSLO https://raw.githubusercontent.com/bmlt-enabled/bmlt-wordpress-deploy/master/deploy-wordpress.sh
          chmod +x deploy-wordpress.sh
          ./deploy-wordpress.sh
